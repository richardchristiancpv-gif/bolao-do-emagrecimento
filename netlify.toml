# =========================================================
# BOLÃO DO EMAGRECIMENTO — CONFIGURAÇÃO OFICIAL NETLIFY
# =========================================================

[build]
  publish = "."

# Suporte completo para PWA e Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de Cache e Atualização Instantânea para PWA
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
